name: Tests

on:
  push:
    branches:
      - main
      - feature/backend-api
  pull_request:
    branches:
      - main

jobs:
  pytest:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hivemind_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      PYTHONPATH: .
      FALKORDB_HOST: "localhost"
      FALKORDB_PORT: "6379"
      POSTGRES_TEST_URL: "postgresql://postgres:postgres@localhost:5432/hivemind_test"
      GEMINI_API_KEY: "mock-gemini-key-for-ci"
      ENVIRONMENT: "test"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest test suite
        run: |
          pytest -v --tb=short --junitxml=test-results.xml 2>&1 | tee test-run.log

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-reports
          path: |
            test-results.xml
            test-run.log
          retention-days: 7
